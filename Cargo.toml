[package]
name = "u2vpodcast"
version = "1.0.1"
edition = "2021"
license = "MIT"
authors = ["Lorenzo Carbonell <lorenzo.carbonell.cerezo@gmail.com>"]
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-cors = "0.7.2"
actix-files = "0.7.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.15.0"
actix-web-httpauth = "0.8.2"
argon2 = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
deunicode = "1.6.2"
filetime = "0.2.29"
rand = "0.10.2"
regex = "1.13.1"
rss = "2.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["sqlite", "chrono", "runtime-tokio"] }
time = { version = "0.3.55", features = ["local-offset"] }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "std", "time"] }
ureq = "3.4.0"
